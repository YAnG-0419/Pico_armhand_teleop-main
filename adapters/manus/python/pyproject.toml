[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manus-teleop"
version = "0.1.0"
description = "Minimal calibrated MANUS skeleton source for Wuji retargeting"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0,<2.4",
]

[tool.setuptools]
packages = ["manus_teleop"]
