# MANUS input driving the repository-provided Wuji Hand 2 model (LEFT HAND).
# Keeps the validated MANUS input scaling/rotation from retarget_manus_left.yaml
# and swaps only the robot kinematic/simulation model and link-name mapping.

optimizer:
  type: "AdaptiveOptimizerAnalytical"
  urdf_path: "../models/hand2_beta/urdf/left.urdf"
  mjcf_path: "../models/hand2_beta/mjcf/left.xml"
  link_naming:
    prefix: "l_"
    palm: "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip: "{finger}_middle"
    dip: "{finger}_distal"
    tip: "{finger}_tip"
    link1: "{finger}_proximal_abd"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  segment_scaling:
    thumb:  [0.98, 1, 1]
    index:  [1.1, 0.989, 1.03]
    middle: [1.10, 0.96, 0.96]
    ring:   [1.1, 0.97, 0.99]
    pinky:  [1.105, 1.15, 1.15]
  pinch_thresholds:
    index:  {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring:   {d1: 2.0, d2: 4.0}
    pinky:  {d1: 2.0, d2: 4.0}
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 15.0
  lp_alpha: 0.2

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
