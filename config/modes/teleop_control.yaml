teleop_safety_gateway:
  ros__parameters:
    allowed_sources:
      - pico
      - replay
    state_timeout: 0.25
    command_timeout: 0.25
    max_joint_speed: 0.5
    max_initial_delta: 0.05
    nominal_dt: 0.01
    # Contact gating is always on. Values are Nm per joint and must remain above free-motion external-torque p99.
    # A missing or stale torque topic disables gating for that side and emits a warning.
    contact_torque_thresholds: [6.0, 6.0, 6.0, 6.0, 3.0, 3.0, 3.0]
